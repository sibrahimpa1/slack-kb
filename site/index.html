<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern · company knowledge in Slack</title>
<meta name="description" content="Lantern answers staff questions in Slack from company docs, cites the source and respects who may read what. Demo on synthetic data.">
<style>:root{
  --paper:#f7f4ee; --card:#fffdf9; --ink:#1f2421; --muted:#6b6f68; --line:#e4ddd0; --soft:#efe9dd;
  --pine:#21302a; --pine2:#2c3f37; --pine-text:#d9e2dc; --pine-muted:#93a39b;
  --amber:#e9952b; --amber-soft:#fbe9cf; --amber-ink:#8a4f07;
  --lock:#a6462f; --lock-soft:#f6e1da; --ok:#2e7a4d; --ok-soft:#dcefe3; --blue:#2f5f8a; --blue-soft:#e1ebf4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans)}
a{color:inherit}
button{font:inherit;cursor:pointer}
#banner{height:28px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--amber);color:#2a1a05;font-size:12.5px;font-weight:600}
#banner a{color:#2a1a05}
#app{height:calc(100vh - 28px);display:grid;grid-template-columns:256px minmax(0,1fr);overflow:hidden}
#app.with-pane{grid-template-columns:256px minmax(0,1fr) 400px}

/* sidebar */
.side{background:var(--pine);color:var(--pine-text);display:flex;flex-direction:column;min-height:0}
.ws{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.ws .logo{width:30px;height:30px;border-radius:9px;background:radial-gradient(circle at 50% 45%,#ffd58a 0,var(--amber) 45%,#a35c0b 100%);box-shadow:0 0 18px rgba(233,149,43,.45)}
.ws b{display:block;color:#fff;font-size:15px}
.ws small{color:var(--pine-muted);font-size:12px}
.as{margin:0 12px 10px;padding:10px;border-radius:10px;background:var(--pine2)}
.as label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--pine-muted);margin-bottom:6px}
.as select{width:100%;background:#17211d;color:#fff;border:1px solid #3b5047;border-radius:7px;padding:6px 8px;font:inherit}
.as .who{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--pine-muted)}
.nav{overflow:auto;padding:4px 8px 12px;flex:1}
.nav h4{margin:14px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--pine-muted);font-weight:600}
.nav a{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:7px;text-decoration:none;color:var(--pine-text)}
.nav a:hover{background:var(--pine2)}
.nav a.on{background:var(--amber);color:#24170a;font-weight:600}
.nav a.off{opacity:.45}
.nav .hash{width:14px;text-align:center;opacity:.8}
.nav .badge{margin-left:auto;background:var(--amber);color:#24170a;border-radius:10px;font-size:11px;padding:0 7px;font-weight:700}
.nav a.on .badge{background:#24170a;color:var(--amber)}
.side .keys{padding:10px 16px 14px;font-size:11.5px;color:var(--pine-muted);border-top:1px solid #33463e}
kbd{font:11px var(--mono);background:rgba(255,255,255,.1);border-radius:4px;padding:1px 5px}
main kbd{background:var(--soft);color:var(--muted)}

/* main */
main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper)}
.head{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--card);min-height:58px}
.head h1{font-size:17px;margin:0}
.head .topic{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .members{margin-left:auto;display:flex}
.av{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.members .av{margin-left:-6px;border:2px solid var(--card)}
.stream{flex:1;overflow:auto;padding:18px 22px 8px}
.day{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:6px 0 14px}
.day:before,.day:after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:grid;grid-template-columns:36px 1fr;gap:10px;margin-bottom:14px}
.msg .av{width:36px;height:36px;border-radius:9px;font-size:13px}
.msg .meta{font-size:12.5px;color:var(--muted)}
.msg .meta b{color:var(--ink);font-size:14px;margin-right:6px}
.msg .body{margin-top:2px}
.bot .av{background:radial-gradient(circle at 50% 40%,#ffd58a 0,var(--amber) 50%,#a35c0b 100%)}
.reply{margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-width:720px}
.reply.private{border-style:dashed;border-color:#c9b28c;background:#fffaf0}
.reply.locked{background:var(--lock-soft);border-color:#e7c3b6}
.reply.unknown{background:#f4f1ea}
.reply p{margin:0 0 8px}
.private-note{font-size:12px;color:var(--amber-ink);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.src{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:12.5px;text-decoration:none}
.src:hover{border-color:var(--amber)}
.src .dot{width:8px;height:8px;border-radius:50%}
.how{font-size:12px;color:var(--muted);margin-top:4px}
.how.warn{color:var(--lock)}
.note{font-size:12.5px;margin-top:6px;padding:6px 9px;border-radius:7px;background:var(--amber-soft);color:var(--amber-ink)}
.fb{display:flex;gap:6px;margin-top:8px}
.fb button{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:3px 10px;font-size:12.5px;color:var(--ink)}
.fb button:hover{border-color:var(--amber)}
.fb button.done{background:var(--ok-soft);border-color:#b6dbc4;color:var(--ok)}
.typing{display:inline-flex;gap:4px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.welcome{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;max-width:760px}
.welcome h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:0 0 6px}
.welcome ol{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.compose{padding:10px 22px 16px;background:var(--paper)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink)}
.chip:hover{border-color:var(--amber);background:var(--amber-soft)}
.box{display:flex;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px}
.box:focus-within{border-color:var(--amber);box-shadow:0 0 0 3px rgba(233,149,43,.15)}
.box input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:14.5px}
.box button{border:0;background:var(--pine);color:#fff;border-radius:8px;padding:7px 14px;font-weight:600}
.box button:disabled{opacity:.4;cursor:default}
.empty{margin:60px auto;max-width:440px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--serif);color:var(--ink);font-size:20px;margin:0 0 6px}

/* doc pane */
.pane{border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.pane .ph{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.pane .ph button{border:0;background:none;font-size:18px;color:var(--muted)}
.doc{overflow:auto;padding:20px 24px 30px}
.doc h2{font-family:var(--serif);font-size:24px;line-height:1.2;margin:4px 0 8px;font-weight:600}
.doc .path{font-size:12.5px;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin:14px 0;padding:12px;background:var(--paper);border-radius:10px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.doc h3{font-family:var(--serif);font-size:16px;margin:18px 0 4px}
.doc .sec{font-family:var(--serif);font-size:15.5px;line-height:1.65;padding:6px 10px;margin:0 -10px;border-radius:8px}
.doc .sec.hit{background:var(--amber-soft);box-shadow:inset 3px 0 0 var(--amber)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;margin:0 4px 4px 0}
.pill.g{background:var(--blue-soft);color:var(--blue)}
.pill.warn{background:var(--amber-soft);color:var(--amber-ink)}
.pill.lock{background:var(--lock-soft);color:var(--lock)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.grey{background:var(--soft);color:var(--muted)}

/* desk pages */
.page{flex:1;overflow:auto;padding:22px 26px 40px}
.page h2{font-family:var(--serif);font-size:24px;margin:0 0 4px;font-weight:600}
.page .lede{color:var(--muted);margin:0 0 18px;max-width:760px}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.lanes.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.lane{background:var(--soft);border-radius:12px;padding:10px;min-height:120px}
.lane h4{margin:2px 4px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.card{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px}
.card:hover,.card.on{border-color:var(--amber)}
.card q{display:block;font-weight:600;quotes:none;margin-bottom:6px}
.card small{color:var(--muted);display:block}
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{margin:0 0 8px;font-size:15px}
.panel textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;resize:vertical}
.panel select,.panel input[type=text]{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:inherit;background:#fff}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-weight:600}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#24170a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.hist{font-size:12.5px;color:var(--muted);margin:10px 0 0;padding-left:16px}
.denied{font-size:12.5px;color:var(--lock);margin-top:6px}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{background:var(--soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.c,th.c{text-align:center}
td .btn{padding:3px 9px;font-size:12px;font-weight:500}
.yes{color:var(--ok);font-weight:700}
.no{color:#c8c0b2}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile b{display:block;font-family:var(--serif);font-size:30px;line-height:1.1}
.tile span{color:var(--muted);font-size:12.5px}
.tile.good b{color:var(--ok)}
.tile.warn b{color:var(--amber-ink)}
.sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mono{font-family:var(--mono);font-size:12px}
.warnbox{background:var(--amber-soft);color:var(--amber-ink);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:10px}
.set{display:grid;grid-template-columns:260px 1fr;gap:6px 20px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.set p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.set input[type=range]{width:260px}
.lockmsg{background:var(--lock-soft);color:var(--lock);border-radius:10px;padding:12px 14px;margin-bottom:14px}

/* palette, toast */
#pal{position:fixed;inset:0;background:rgba(20,26,23,.35);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:20}
#pal.open{display:flex}
#pal .in{width:520px;max-width:92vw;background:var(--card);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
#pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font:inherit;font-size:16px;outline:0}
#pal ul{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
#pal li{padding:7px 10px;border-radius:8px;display:flex;justify-content:space-between;cursor:pointer}
#pal li.on{background:var(--amber-soft)}
#pal li small{color:var(--muted)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--pine);color:#fff;padding:9px 16px;border-radius:10px;transition:.2s;pointer-events:none;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:900px){
  #app,#app.with-pane{grid-template-columns:1fr}
  .side{display:none}
  .pane{position:fixed;inset:28px 0 0 0;z-index:10}
  .lanes,.tiles,.sources{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
}
</style>
</head>

<script>window.LANTERN = {"now":"2026-11-24","company":"Fernhill","groups":{"all_staff":"All employees","contractors":"Contractors","eng":"Engineering","sales":"Sales","people_ops":"People Ops","finance":"Finance","managers":"People managers","leadership":"Leadership team"},"users":{"maya":{"name":"Maya Okafor","title":"Backend engineer","groups":["all_staff","eng"],"slack":"U01MAYA"},"jonas":{"name":"Jonas Weber","title":"Account executive","groups":["all_staff","sales"],"slack":"U02JONAS"},"ruth":{"name":"Ruth Lindqvist","title":"Head of People Ops","groups":["all_staff","people_ops","managers"],"slack":"U03RUTH"},"dev":{"name":"Dev Sharma","title":"Contract frontend developer","groups":["contractors"],"slack":"U04DEV"},"ana":{"name":"Ana Costa","title":"Finance lead","groups":["all_staff","finance","managers"],"slack":"U05ANA"},"leo":{"name":"Leo Brandt","title":"CEO","groups":["all_staff","managers","leadership"],"slack":"U06LEO"}},"admins":["ruth","leo"],"channels":{"ask-people-ops":{"members":["maya","jonas","ruth","ana","leo"],"topic":"Questions about leave, pay days, benefits and policies"},"eng-help":{"members":["maya","dev"],"topic":"Engineering questions, deploys, on-call"},"sales-floor":{"members":["jonas","ana","leo"],"topic":"Deals, pricing and discount approvals"}},"sources":{"confluence":{"name":"Confluence","scope":"Spaces HR, ENG, SALES"},"drive":{"name":"Google Drive","scope":"Shared drives Finance, People, Leadership"},"notion":{"name":"Notion","scope":"Workspace Company handbook"}},"docs":[{"id":"D-01","title":"Travel and expenses policy 2026","source":"drive","path":"Finance / Policies","owner":"ana","groups":["all_staff"],"discoverable":true,"updated":"2026-01-12","review_by":"2027-01-12","sections":[["Per diem and hotels","The daily allowance for meals on business travel is EUR 55 per day. Hotels are capped at EUR 160 per night, or EUR 220 per night in London, Paris and Zurich. Book through the travel desk so the rate is applied automatically."],["Receipts and claims","Submit every expense with a receipt in the expense app within 30 days of the cost. Claims older than 90 days are not reimbursed. Reimbursements are paid with the next payroll run."],["Approvals","Any single expense over EUR 500 needs your manager's approval before you spend it. Flights over EUR 900 also need approval from Finance."]]},{"id":"D-02","title":"Travel policy 2024","source":"drive","path":"Finance / Policies / Archive","owner":"ana","groups":["all_staff"],"discoverable":true,"updated":"2024-02-03","review_by":"2025-02-03","superseded_by":"D-01","sections":[["Per diem and hotels","The daily allowance for meals on business travel is EUR 45 per day. Hotels are capped at EUR 130 per night."],["Receipts","Submit expenses with receipts within 60 days."]]},{"id":"D-03","title":"Parental leave","source":"confluence","path":"HR / Leave","owner":"ruth","groups":["all_staff"],"discoverable":true,"updated":"2026-03-02","review_by":"2027-03-02","sections":[["How much leave","The primary caregiver gets 20 weeks of parental leave at full pay. The secondary caregiver gets 6 weeks at full pay. Both can be taken in up to three blocks within 18 months of the birth or adoption."],["How to request it","Tell People Ops at least 8 weeks before the leave starts. Your manager plans cover with you; you do not need to find cover yourself."]]},{"id":"D-04","title":"Time off and public holidays","source":"notion","path":"Company handbook / Time off","owner":"ruth","groups":["all_staff"],"discoverable":true,"updated":"2025-09-18","review_by":"2026-09-18","sections":[["Annual leave","Everyone gets 25 days of paid annual leave plus the public holidays of their country of employment. Up to 5 unused days carry over and must be used by 31 March."],["Booking time off","Request leave in the HR portal at least two weeks ahead for anything longer than three days. Sick days do not count against annual leave; tell your manager before 10:00 on the day."]]},{"id":"D-05","title":"Salary bands 2026","source":"drive","path":"People / Compensation","owner":"ruth","groups":["people_ops","leadership"],"discoverable":true,"updated":"2026-02-01","review_by":"2027-02-01","canary":"EUR 64,000","sections":[["Engineering bands","Engineer L2 is EUR 52,000 to EUR 63,000. Engineer L3 is EUR 64,000 to EUR 78,000. Senior engineer L4 is EUR 79,000 to EUR 96,000."],["Sales bands","Account executive base salary is EUR 48,000 to EUR 60,000 with on-target earnings up to EUR 95,000."]]},{"id":"D-06","title":"Q1 organisation changes (draft)","source":"drive","path":"Leadership / Planning","owner":"leo","groups":["leadership"],"discoverable":false,"updated":"2026-11-10","review_by":"2026-12-15","canary":"merge the Platform and Data teams","sections":[["Proposal","We plan to merge the Platform and Data teams under one director from 1 February and close the Lisbon office lease when it ends in June."]]},{"id":"D-07","title":"On-call runbook","source":"confluence","path":"ENG / Operations","owner":"maya","groups":["eng","contractors"],"discoverable":true,"updated":"2026-10-05","review_by":"2027-04-05","sections":[["Severity levels","Sev1 means customers cannot ship or track parcels; page the on-call engineer and acknowledge within 5 minutes. Sev2 means a degraded feature; acknowledge within 30 minutes. Sev3 waits for working hours."],["During an incident","The first responder becomes incident commander until they hand over. Open a channel named inc-date-topic, post updates every 30 minutes for a Sev1, and write the postmortem within 5 working days."]]},{"id":"D-08","title":"How we deploy","source":"confluence","path":"ENG / Delivery","owner":"maya","groups":["eng","contractors"],"discoverable":true,"updated":"2026-06-20","review_by":"2026-12-20","sections":[["Reviews","Every change to main needs two approving reviews, one of them from a code owner. CI must be green before merge."],["Deploy windows","Production deploys run Monday to Thursday until 16:00 and on Friday until 14:00. There is a deploy freeze from 20 December to 3 January."]]},{"id":"D-09","title":"Production access","source":"confluence","path":"ENG / Security","owner":"maya","groups":["eng"],"discoverable":true,"updated":"2026-05-14","review_by":"2026-11-14","sections":[["Who gets access","Employees on the engineering on-call rota get production access through the access gateway, approved by their lead and renewed every 90 days. Contractors never get standing production access."],["Break-glass","In a Sev1, the incident commander can grant 4 hours of break-glass access; it is logged and reviewed the next day."]]},{"id":"D-10","title":"Discount approval matrix","source":"confluence","path":"SALES / Deal desk","owner":"ana","groups":["sales","finance","leadership"],"discoverable":true,"updated":"2026-07-01","review_by":"2027-01-01","sections":[["Who approves what","Account executives can give up to 10% discount on the first year. 10% to 20% needs the sales manager. Anything above 20%, or any multi-year price lock, needs the CFO."],["Paperwork","Log the approval in the deal record before sending the order form. Unlogged discounts are reversed at invoicing."]]},{"id":"D-11","title":"Customer data handling","source":"notion","path":"Company handbook / Security","owner":"maya","groups":["all_staff","contractors"],"discoverable":true,"updated":"2026-04-22","review_by":"2027-04-22","sections":[["Rules","Never copy customer data into personal tools, personal email or AI tools that are not on the approved list. Exports must be deleted within 30 days or when the ticket closes, whichever is first."],["Requests from customers","Forward any deletion or access request to the privacy inbox the same day. We have 30 days to answer under GDPR."]]},{"id":"D-12","title":"Laptops and home office","source":"notion","path":"Company handbook / Equipment","owner":"ruth","groups":["all_staff","contractors"],"discoverable":true,"updated":"2026-01-30","review_by":"2027-01-30","sections":[["Laptops","Employees and contractors get a company laptop, replaced every three years. Lost or stolen laptops must be reported to IT within 24 hours."],["Home office budget","Employees get a one-off EUR 400 home office budget in their first year and EUR 150 per year after that. Contractors are not eligible."]]},{"id":"D-13","title":"Reporting a security incident","source":"notion","path":"Company handbook / Security","owner":"maya","groups":["all_staff","contractors"],"discoverable":true,"updated":"2026-08-09","review_by":"2027-08-09","sections":[["What to do","If you click a suspicious link, lose a device or see data where it should not be, post in the security channel or page security within 1 hour. Do not try to investigate it yourself."]]},{"id":"D-14","title":"Benefits overview","source":"confluence","path":"HR / Benefits","owner":"ruth","groups":["all_staff"],"discoverable":true,"updated":"2025-04-10","review_by":"2026-04-10","sections":[["Health and wellbeing","Private health insurance covers you and your dependants from your first day. The wellbeing allowance is EUR 40 per month for gym, sport or therapy."],["Learning","Each employee has a EUR 1,200 yearly learning budget for courses, books and conferences, approved by their manager."]]},{"id":"D-15","title":"Board pack Q3 2026","source":"drive","path":"Leadership / Board","owner":"leo","groups":["leadership"],"discoverable":false,"updated":"2026-10-20","review_by":"2027-01-20","canary":"EUR 4.2 million","sections":[["Results","Q3 revenue was EUR 4.2 million, 6% under plan, with net revenue retention of 108%. Runway is 22 months."]]},{"id":"D-16","title":"Contractor guide","source":"confluence","path":"HR / Contractors","owner":"ruth","groups":["contractors","people_ops"],"discoverable":true,"updated":"2026-05-05","review_by":"2027-05-05","sections":[["Invoicing","Contractors invoice monthly by the 5th working day, with hours by project. Invoices are paid within 14 days."],["Time off","Contractors are not on the employee leave scheme; tell your project lead about planned absences two weeks ahead."]]},{"id":"D-17","title":"Engineering career ladder","source":"confluence","path":"ENG / People","owner":"maya","groups":["all_staff"],"discoverable":true,"updated":"2026-02-15","review_by":"2027-02-15","sections":[["Levels","Engineering has five levels, L1 to L5. Promotions are decided twice a year, in March and September, by a panel of two leads who did not manage you."]]},{"id":"D-18","title":"Payroll calendar","source":"drive","path":"Finance / Payroll","owner":"ana","groups":["all_staff"],"discoverable":true,"updated":"2026-01-05","review_by":"2027-01-05","sections":[["Pay day","Salaries are paid on the 25th of each month, or the last working day before it. In December pay day is 20 December."],["Payslips","Payslips appear in the HR portal two working days before pay day."]]},{"id":"FAQ-05","title":"FAQ: What is the wifi password for guests?","source":"lantern","path":"Lantern / Answered questions","owner":"ruth","groups":["all_staff","contractors"],"discoverable":true,"updated":"2026-11-24","review_by":"2027-05-24","sections":[["Answer","The guest wifi password is shown on the reception screen and changes every Monday."]]}],"cases":[{"id":"Q-01","who":"maya","where":null,"q":"What is the per diem for meals when I travel?","expect":"answer","doc":"D-01"},{"id":"Q-02","who":"jonas","where":"ask-people-ops","q":"How many weeks of parental leave does the primary caregiver get?","expect":"answer","doc":"D-03","vis":"channel"},{"id":"Q-03","who":"maya","where":"ask-people-ops","q":"Can I carry over unused vacation days?","expect":"answer","doc":"D-04","vis":"channel"},{"id":"Q-04","who":"ana","where":null,"q":"When is pay day in December?","expect":"answer","doc":"D-18"},{"id":"Q-05","who":"jonas","where":null,"q":"What is the hotel cap per night in London?","expect":"answer","doc":"D-01"},{"id":"Q-06","who":"maya","where":null,"q":"How much can I spend on courses and confe rms":["caregiver","leave","parental","primary","week"],"text":"The primary caregiver gets 20 weeks of parental leave at full pay, and the secondary caregiver gets 6 weeks. You can split it into up to three blocks within 18 months.","stale":false,"superseded_seen":[],"owner":"ruth","retrieved":["D-03#1","D-03#2","D-04#2","D-04#1"],"visibility":"channel","draft":{"status":"accepted"},"feedback":[],"case":"Q-02"},{"id":"M-003","asker":"maya","channel":"ask-people-ops","question":"Can I carry over unused vacation days?","decision":"answer","doc":"D-04","chunks":["D-04#1"],"terms":["carry","day","leave","over","unused"],"text":"Yes, up to 5 unused days carry over, but you have to use them by 31 March.","stale":true,"superseded_seen":[],"owner":"ruth","retrieved":["D-04#1","D-04#2","D-01#3","D-03#1"],"visibility":"channel","draft":{"status":"accepted"},"feedback":[],"case":"Q-03"},{"id":"M-004","asker":"ana","channel":null,"question":"When is pay day in December?","decision":"answer","doc":"D-18","chunks":["D-18#1"],"terms":["day","december","pay"],"text":"In December pay day is 20 December. In other months salaries are paid on the 25th, or the last working day before it.","stale":false,"superseded_seen":[],"owner":"ana","retrieved":["D-18#1","D-18#2","D-03#1","D-04#2"],"visibility":"dm","draft":{"status":"accepted"},"feedback":[],"case":"Q-04"},{"id":"M-005","asker":"jonas","channel":null,"question":"What is the hotel cap per night in London?","decision":"answer","doc":"D-01","chunks":["D-01#1"],"terms":["cap","hotel","london","night","per"],"text":"In London the hotel cap is EUR 220 per night (EUR 160 elsewhere, except Paris and Zurich, which are also EUR 220).","stale":false,"superseded_seen":["D-02"],"owner":"ana","retrieved":["D-01#1","D-02#1","D-14#1","D-12#2"],"visibility":"dm","draft":{"status":"accepted"},"feedback":[],"case":"Q-05"},{"id":"M-006","asker":"maya","channel":null,"question":"How much can I spend on courses and conferences each year?","decision":"ans       });

      if (personal.decision === "unknown" && personal.owner === asker) personal.owner = asker === "ruth" ? "leo" : "ruth";
      if (!channel) return Object.assign(personal, { visibility: "dm" });

      var pub = decide(ix, question, function (d) { return visibleToAll(ix, members, d, users); }, settings);

      if (personal.decision === "answer") return Object.assign(personal, { visibility: "ephemeral" });

<script>(function () {
  "use strict";
  var D = window.LANTERN;

  var U = D.users, CH = D.channels, G = D.groups;
  var COLORS = { maya: "#2f6f8a", jonas: "#7a4fa0", ruth: "#b0532e", dev: "#3f7d4f", ana: "#9a6b12", leo: "#33465f" };
  var SRC_COLORS = { confluence: "#2f5f8a", drive: "#2e7a4d", notion: "#55514a", lantern: "#e9952b" };

  var S = {
    as: "maya",
    settings: Object.assign({}, D.engine.defaults, { log_question_text: true }),
    msgs: D.messages.map(function (m, i) { return Object.assign({}, m, { t: time(i) }); }),
    gaps: JSON.parse(JSON.stringify(D.gaps)),
    reviews: JSON.parse(JSON.stringify(D.reviews)),
    audit: JSON.parse(JSON.stringify(D.audit)),
    main: "dm", pane: null, pending: null, palette: false, edit: null, flash: {},
    seq: D.audit.length, msgN: D.messages.length,
  };

  function time(i) { var m = 9 * 60 + 4 + i * 7; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(sel) { return document.querySelector(sel); }
  function first(n) { return U[n].name.split(" ")[0]; }
  function initials(n) { return U[n].name.split(" ").map(function (p) { return p[0]; }).join(""); }
  function av(n, cls) { return '<span class="av ' + (cls || "") + '" style="background:' + COLORS[n] + '" title="' + esc(U[n].name) + '">' + initials(n) + "</span>"; }
  function isAdmin(n) { return D.admins.indexOf(n) >= 0; }
  function canRead(n, docId) { return E.canRead(ix, U[n].groups, docId); }
  function srcName(k) { return (D.sources[k] || { name: "Lantern" }).name; }
  function now() { return D.now; }
  function log(actor, action, detail) { S.audit.push(Object.assign({ seq: ++S.seq, actor: actor, action: action }, detail)); }
  function toast(t) { var el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("show"); }, 2200); }

  // ---------- routing ----------
  function parse() {
    var h = location.hash.replace(/^#/, ""), q = "";
    if (h.indexOf("?") >= 0) { q = h.split("?")[1]; h = h.split("?")[0]; }
    var as = (q.match(/as=([a-z]+)/) || [])[1];
    if (as && U[as]) S.as = as;
    if (!h) h = "dm";
    var p = h.split("/");
    if (p[0] === "doc") { S.pane = { doc: p[1], hit: p[2] ? p[1] + "#" + p[2] : null }; }
    else { S.main = h; if (p[0] !== "gap") S.edit = null; }
  }
  function go(h) { location.hash = h; }

  // ---------- asking ----------
  function where() { var p = S.main.split("/"); return p[0] === "c" ? p[1] : null; }
  function ask(q) {
    q = q.trim();
    if (!q || S.pending) return;
    var ch = where();
    S.pending = { ch: ch, q: q, who: S.as };
    render();
    setTimeout(function () {
      var seed = D.messages.filter(function (m) { return m.asker === S.as && m.channel === ch && m.question.toLowerCase() === q.toLowerCase(); })[0];
      var r = seed ? JSON.parse(JSON.stringify(seed)) : E.ask(ix, q, S.as, ch, S.settings, U, CH);
      var m = Object.assign({}, r, { id: "M-" + String(++S.msgN).padStart(3, "0"), asker: S.as, channel: ch, question: q, feedback: [], t: time(S.msgN), draft: seed ? seed.draft : null, fresh: true });
      S.msgs.push(m);
      if (m.decision === "unknown") {
        S.gaps.push({ id: "G-" + String(S.gaps.length + 1).padStart(2, "0"), question: q, asker: S.as, channel: ch, owner: m.owner, state: "open", kind: "no answer", history: [["open", S.as]] });
        m.gap = S.gaps[S.gaps.length - 1].id;
      }
      var docs = Array.from(new Set((m.chunks || []).map(function (c) { return c.split("#")[0]; })));
      log(S.as, "question", { message: m.id, decision: m.decision, visibility: m.visibility, docs: docs,

      render();
    }, 650);
  }

  function feedback(id, kind) {
    var m = S.msgs.filter(function (x) { return x.id === id; })[0];
    if (!m || m.feedback.some(function (f) { return f[0] === S.as && f[1] === kind; })) return;
    m.feedback.push([S.as, kind]);
    if (kind === "not_helpful") S.gaps.push({ id: "G-" + String(S.gaps.length + 1).padStart(2, "0"), question: m.question, asker: S.as, channel: m.channel, owner: m.owner || "ruth", state: "open", kind: "answer not helpful", history: [["open", S.as]] });
    if (kind === "outdated" && m.doc) S.reviews.push({ doc: m.doc, owner: ix.docs[m.doc].owner, reason: "flagged outdated by " + S.as, state: "open" });

  }

  // ---------- gap workflow (mirrors lantern/workspace.py) ----------

  function allowed(g, action, actor) {
    if (FLOW[g.state].indexOf(action) < 0) return "Can't " + action + " a gap that is " + g.state + ".";
    if (["assign", "dismiss", "reopen"].indexOf(action) >= 0 && !isAdmin(actor)) return "Only a knowledge admin (Ruth or Leo) can " + action + ".";
    if (["answer", "publish"].indexOf(action) >= 0 && !(actor === g.owner || isAdmin(actor))) return "Only " + first(g.owner) + " (the owner) or a knowledge admin can " + action + ".";
    return null;
  }
  function move(id, action, kw) {
    var g = S.gaps.filter(function (x) { return x.id === id; })[0];
    var no = allowed(g, action, S.as);
    if (no) { toast(no); return; }
    if (action === "assign") { g.owner = kw.to; g.state = "assigned"; }
    if (action === "answer") {
      if (!kw.text.trim()) { toast("Write the answer first."); return; }
      g.answer = kw.text.trim(); g.groups = kw.groups.length ? kw.groups : ["all_staff"]; g.state = "answered";
    }
    if (action === "publish") {
      var docId = "FAQ-" + id.slice(2);
      ix.add({ id: docId, title: "FAQ: " + g.question, source: "lantern", path: "Lantern / Answered questions", owner: g.owner, groups: g.groups,
        discoverable: true, updated: now(), review_by: "2027-05-24", sections: [["Answer", g.answer]] });

    }
    if (action === "dismiss") { g.reason = kw.reason || ""; g.state = "dismissed"; }
    if (action === "reopen") { g.state = "open"; }
    g.history.push([g.state, S.as]);
    log(S.as, "gap " + action, { gap: id, state: g.state });
    toast({ assign: "Assigned to " + (kw && kw.to ? first(kw.to) : ""), answer: "Answer saved. Publish it to make it searchable.", publish: "Published. The next person who asks gets this answer.", dismiss: "Dismissed.", reopen: "Reopened." }[action]);
    render();
  }

  // ---------- views ----------
  function sidebar() {
    var me = S.as, h = "";
    h += '<div class="ws"><div class="logo"></div><div><b>' + esc(D.company) + '</b><small>Lantern for Slack</small></div></div>';
    h += '<div class="as"><label for="as">Viewing as</label><select id="as">' + Object.keys(U).map(function (k) {
      return '<option value="' + k + '"' + (k === me ? " selected" : "") + ">" + esc(U[k].name) + " · " + esc(U[k].title) + "</option>";
    }).join("") + '</select><div class="who">' + av(me) + "<span>" + U[me].groups.map(function (g) { return esc(G[g]); }).join(", ") + (isAdmin(me) ? " · knowledge admin" : "") + "</span></div></div>";
    h += '<nav class="nav"><h4>Channels</h4>';
    Object.keys(CH).forEach(function (c) {
      var mem = CH[c].members.indexOf(me) >= 0;
      h += '<a href="#c/' + c + '" class="' + (S.main === "c/" + c ? "on " : "") + (mem ? "" : "off") + '"><span class="hash">#</span>' + c + "</a>";
    });
    h += '<h4>Direct messages</h4><a href="#dm" class="' + (S.main === "dm" ? "on" : "") + '"><span class="hash">◉</span>Lantern</a>';
    var mine = S.gaps.filter(function (g) { return (g.state === "open" || g.state === "assigned" || g.state === "answered") && (g.owner === me || isAdmin(me)); }).length;
    var desk = [["gaps", "Knowledge gaps", mine], ["sources", "Sources and sync"], ["access", "Who can read what"], ["evals", "Evals"], ["settings", "Answer settings"], ["audit", "Audit log"]];
    h += "<h4>Knowledge desk</h4>" + desk.map(function (d) {
      var on = S.main === d[0] || (d[0] === "gaps" && S.main.indexOf("gap/") === 0);
      return '<a href="#' + d[0] + '" class="' + (on ? "on" : "") + '"><span class="hash">›</span>' + d[1] + (d[2] ? '<span class="badge">' + d[2] + "</span>" : "") + "</a>";
    }).join("");
    h += '</nav><div class="keys"><kbd>⌘K</kbd> jump · <kbd>/</kbd> ask · <kbd>Esc</kbd> close</div>';
    return '<aside class="side">' + h + "</aside>";
  }

  function srcChip(c, m) {
    var docId = c.split("#")[0], d = ix.docs[docId];

  }

  function replyCard(m) {

      h += "<p>" + esc(m.text) + "</p>";

      else if (m.draft && m.draft.status === "rejected") h += '<div class="how warn">Claude\'s draft was rejected: it ' + esc(m.draft.reason.replace(/^cites/, "cited").replace(/^states/, "stated")) + ". Showing the passage as written instead.</div>";

  }

  function pendingHtml(ch) {
    if (!S.pending || S.pending.ch !== ch) return "";

      '<div class="msg bot"><span class="av"></span><div><div class="meta"><b>Lantern</b>looking through Confluence, Google Drive and Notion…</div><div class="typing"><i></i><i></i><i></i></div></div></div>';
  }

  function channelView(ch) {
    var c = CH[ch];
    var head = '<div class="head"><h1># ' + ch + '</h1><span class="topic">' + esc(c.topic) + '</span><span class="members">' + c.members.map(function (m) { return av(m); }).join("") + "</span></div>";

      "<li>Ask in your own words; I'll cite the page.</li><li>If something isn't shared with you, I'll say who owns it, not what's in it.</li><li>If nobody wrote it down yet, I ask the right person and remember the answer.</li></ol></div>";
    return '<div class="head"><h1>Lantern</h1><span class="topic">Direct message · answers only you can see</span></div><div class="stream" id="stream">' + w + list.map(messageHtml).join("") + pendingHtml(null) + "</div>" + composer(null);
  }

  function docPane() {
    var id = S.pane.doc, d = ix.docs[id];

      h += '<div class="row"><button class="btn pri" data-gap="answer" ' + (no("answer") ? "disabled" : "") + '>Save answer</button><input type="text" id="gap-reason" placeholder="Reason to dismiss"><button class="btn" data-gap="dismiss" ' + (no("dismiss") ? "disabled" : "") + ">Dismiss</button></div>";

  function sourcesView() {

      return "<tr><td>" + c.id + "</td><td>" + esc(first(c.who)) + "</td><td>" + (c.where ? "#" + esc(c.where) : "DM") + "</td><td>" + esc(c.q) + "</td><td>" + esc(c.expect) + (c.want_doc ? " · " + c.want_doc : "") + "</td><td>" + esc(c.got) + (c.doc ? " · " + c.doc : "") + "</td><td>" + esc(c.visibility) + '</td><td class="c">' + (c.pass ? '<span class="yes">✓</span>' : "✗") + "</td></tr>";

  function settingsView() {

    h += '<div class="set"><div><b>Archived versions</b><p>Older versions rank lower and can never be the only source of an answer.</p></div><div><span class="pill grey">weight ' + st.superseded_weight + "</span></div></div>";

  function auditView() {
    if (!isAdmin(S.as)) return '<div class="head"><h1>Knowledge desk</h1></div><div class="page"><h2>Audit log</h2><div class="lockmsg">Only knowledge admins can read the audit log. Switch to Ruth or Leo on the left.</div></div>';

        var v = r[k]; return '<span style="color:var(--muted)">' + k + ":</span> " + esc(Array.isArray(v) ? v.join(", ") || "none" : v);
      }).join(" · ");

  function mainView() {
    var p = S.main.split("/");
    if (p[0] === "c" && CH[p[1]]) return channelView(p[1]);
    if (p[0] === "gaps" || p[0] === "gap") return gapsView();
    if (p[0] === "sources") return sourcesView();
    if (p[0] === "access") return accessView();
    if (p[0] === "evals") return evalsView();
    if (p[0] === "settings") return settingsView();
    if (p[0] === "audit") return auditView();
    return dmView();
  }

  function render() {
    var app = $("#app"), keepQ = $("#q") ? $("#q").value : "", focused = document.activeElement && document.activeElement.id === "q";
    app.className = S.pane ? "with-pane" : "";
    app.innerHTML = sidebar() + "<main>" + mainView() + "</main>" + (S.pane ? docPane() : "");
    var st = $("#stream");
    if (st) st.scrollTop = st.scrollHeight;
    if ($("#q")) { $("#q").value = S.pending ? "" : keepQ; if (focused) $("#q").focus(); }
    if (S.pane && S.pane.hit) { var el = document.getElementById("sec-" + S.pane.hit.split("#")[1]); if (el) el.scrollIntoView({ block: "center" }); }
    palette();
  }

  // ---------- palette ----------
  function items() {
    var out = Object.keys(CH).map(function (c) { return ["#" + c, "channel", "#c/" + c]; });
    out.push(["Lantern", "direct message", "#dm"]);
    [["Knowledge gaps", "gaps"], ["Sources and sync", "sources"], ["Who can read what", "access"], ["Evals", "evals"], ["Answer settings", "settings"], ["Audit log", "audit"]].forEach(function (x) { out.push([x[0], "desk", "#" + x[1]]); });
    ix.order.forEach(function (id) { if (canRead(S.as, id)) out.push([ix.docs[id].title, srcName(ix.docs[id].source), "#doc/" + id]); });
    return out;
  }
  var palSel = 0;
  function palette() {
    var el = $("#pal");
    if (!el) { el = document.createElement("div"); el.id = "pal"; el.innerHTML = '<div class="in"><input id="palq" placeholder="Jump to a channel, page or desk view" aria-label="Jump to"><ul id="pall"></ul></div>'; document.body.appendChild(el);
      el.addEventListener("click", function (e) { if (e.target === el) { S.palette = false; palette(); } var li = e.target.closest("li"); if (li) { S.palette = false; palette(); go(li.dataset.h.slice(1)); } });
      $("#palq").addEventListener("input", function () { palSel = 0; fill(); });
    }
    el.classList.toggle("open", S.palette);
    if (S.palette) fill();
  }
  function fill() {
    var q = $("#palq").value.toLowerCase();
    var list = items().filter(function (x) { return x[0].toLowerCase().indexOf(q) >= 0; }).slice(0, 12);
    palSel = Math.max(0, Math.min(palSel, list.length - 1));
    $("#pall").innerHTML = list.map(function (x, i) { return '<li data-h="' + x[2] + '" class="' + (i === palSel ? "on" : "") + '"><span>' + esc(x[0]) + "</span><small>" + esc(x[1]) + "</small></li>"; }).join("") || "<li><small>No match</small></li>";
  }

  // ---------- events ----------
  document.addEventListener("submit", function (e) {
    if (e.target.id === "ask") { e.preventDefault(); var v = $("#q").value; $("#q").value = ""; ask(v); }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "as") { S.as = t.value; S.pane = null; toast("Now viewing as " + U[S.as].name); var h = S.main; go(h + "?as=" + S.as); render(); return; }
    if (t.dataset && t.dataset.set) {
      if (!isAdmin(S.as)) return;
      var k = t.dataset.set, old = S.settings[k];
      var v = t.type === "checkbox" ? t.checked : t.type === "range" ? parseFloat(t.value) : parseInt(t.value, 10);
      S.settings[k] = v;
      log(S.as, "setting", { key: k, old: old, new: v });
      toast("Saved. Applies to the next question.");
      render();
    }
  });
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-ask],[data-fb],[data-close],[data-gap],[data-share],[data-share-save]");
    if (!t) return;
    if (t.dataset.ask) { ask(t.dataset.ask); return; }
    if (t.dataset.fb) { var p = t.dataset.fb.split("|"); feedback(p[0], p[1]); return; }
    if (t.hasAttribute("data-close")) { S.pane = null; go(S.main); render(); return; }
    if (t.dataset.gap) {
      var id = S.main.split("/")[1], a = t.dataset.gap;
      var kw = {};
      if (a === "assign") kw.to = $("#gap-to").value;
      if (a === "answer") { kw.text = $("#gap-text").value; kw.groups = Array.from(document.querySelectorAll('input[name="grp"]:checked')).map(function (x) { return x.value; }); }
      if (a === "dismiss") kw.reason = ($("#gap-reason") || {}).value || "";
      move(id, a, kw);
      return;
    }
    if (t.dataset.share) { S.edit = S.edit === t.dataset.share ? null : t.dataset.share; render(); return; }
    if (t.dataset.shareSave) {
      var d = ix.docs[t.dataset.shareSave], old = d.groups.slice();
      var g = Array.from(document.querySelectorAll('input[name="share"]:checked')).map(function (x) { return x.value; });
      d.groups = g; ix.build(); S.edit = null;
      log("sync:" + d.source, "permissions", { doc: d.id, old: old, new: g });
      toast(g.length ? "Sharing updated for " + d.title : d.title + " is now shared with nobody");
      render();
    }
  });
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); S.palette = !S.palette; palette(); if (S.palette) { $("#palq").value = ""; fill(); $("#palq").focus(); } return; }
    if (S.palette) {
      var n = document.querySelectorAll("#pall li").length;
      if (e.key === "Escape") { S.palette = false; palette(); }
      if (e.key === "ArrowDown") { palSel = (palSel + 1) % n; fill(); e.preventDefault(); }
      if (e.key === "ArrowUp") { palSel = (palSel - 1 + n) % n; fill(); e.preventDefault(); }
      if (e.key === "Enter") { var li = document.querySelectorAll("#pall li")[palSel]; if (li && li.dataset.h) { S.palette = false; palette(); go(li.dataset.h.slice(1)); } }
      return;
    }
    if (e.key === "Escape" && S.pane) { S.pane = null; go(S.main); render(); }
    if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA" && $("#q")) { e.preventDefault(); $("#q").focus(); }
  });
  window.addEventListener("hashchange", function () {
    var before = S.pane;
    var h = location.hash;
    if (h.indexOf("#doc/") !== 0) S.pane = null;
    parse(); render();
  });

  parse();
  if (location.hash.indexOf("#doc/") === 0 && !S.main) S.main = "dm";
  render();
})();
</script>
